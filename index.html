<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LettreMagique - Ta lettre de motivation en 1 clic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-blue-600 mb-2">✨ LettreMagique</h1>
            <p class="text-gray-500">Génère une lettre de motivation parfaite grâce à l'Intelligence Artificielle.</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">1. Colle ton CV ici</label>
                <textarea id="cv" rows="5" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Master en Marketing..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">2. Colle l'offre d'emploi ici</label>
                <textarea id="job" rows="5" class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: Nous recherchons un Chef de Projet..."></textarea>
            </div>

            <button id="generateBtn" onclick="genererLettre()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition duration-300">
                Générer ma lettre magique 🚀
            </button>
        </div>

        <div id="resultBox" class="mt-8 hidden">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Ta Lettre :</h2>
            <div id="resultText" class="p-6 bg-gray-100 rounded-xl whitespace-pre-wrap text-gray-700 border border-gray-200"></div>
        </div>
    </div>

    <script>
        async function genererLettre() {
            const cv = document.getElementById('cv').value;
            const job = document.getElementById('job').value;
            const btn = document.getElementById('generateBtn');
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if (!cv || !job) { alert("Remplis les deux champs !"); return; }

            btn.innerHTML = "Création en cours... ⏳";
            btn.disabled = true;

            try {
                // On appelle NOTRE propre coffre-fort (le serveur) au lieu de Google
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cv: cv, job: job })
                });

                const data = await response.json();
                
                if(data.error) {
                    alert("Erreur: " + data.error);
                } else {
                    resultText.innerText = data.letter;
                    resultBox.classList.remove('hidden');
                }
            } catch (error) {
                alert("Erreur de connexion.");
            } finally {
                btn.innerHTML = "Générer ma lettre magique 🚀";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
